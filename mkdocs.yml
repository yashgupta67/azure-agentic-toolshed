site_name: Azure Agentic Toolshed
site_description: "Working Azure agent plumbing, with receipts. Deployable MCP artifacts, failure-first docs, and machine-checked staleness for Logic Apps + Foundry agent tooling."
# Once this repo is pushed to GitHub, fill these in, e.g.:
# site_url: https://yashgupta67.github.io/azure-agentic-toolshed/
# repo_name: yashgupta67/azure-agentic-toolshed
# repo_url: https://github.com/yashgupta67/azure-agentic-toolshed
# edit_uri: edit/main/docs/

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Help: help/index.md
  - The gap analysis: logic-apps-mcp/mcp-gap-analysis.md
  - Logic Apps + MCP:
      - Conventions: logic-apps-mcp/conventions.md
  - Cross-host compatibility: cross-host/index.md
  - Agent loop:
      - Overview: agent-loop/index.md
      - Loop circuit breaker: agent-loop/loop-circuit-breaker.md
      - Reflection loop: agent-loop/reflection-loop.md
      - Plan-execute-replan: agent-loop/plan-execute-replan.md
      - Debate consensus: agent-loop/debate-consensus.md
      - Confidence-gated escalation: agent-loop/confidence-gated-escalation.md
      - Checkpoint/resume: agent-loop/checkpoint-resume.md
  - Orchestration: orchestration/index.md
  - Foundry tools: foundry-tools/index.md
  - Plumbing: plumbing/index.md
  - Concordance: concordance/index.md
  - Failures (by error text): failures/index.md
  - Learning path: learning/index.md

plugins:
  - search
